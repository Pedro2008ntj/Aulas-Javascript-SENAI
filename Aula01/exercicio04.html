<body>
    <h1>Integrando os rcursos do JS</h1>
    <hr>
    <script>
         window.confirm("Seja bem-vindo ao site ");
         let nome = window.prompt ("QUAL É O SEU NOME? ");
         window.alert(nome);
         console.log(nome);
         let resposta = window.confirm("você deseja sair da página? ");
         
         if(resposta==true){
            setTimeout(() => {
                window.open("index.html");
            
            }, 3000); // 3000 milissegundos = 3 segundos

        }else{
            window.confirm(nome + ", você vai continar nessa página!");
        }
         
    </script>
