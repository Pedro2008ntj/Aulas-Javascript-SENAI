<body>
    <h1>Calculando 2 números</h1>
    <hr>
    <script>

        let num1 = number(prompt(" Escolha 1 número: "));
        let num2 = number(prompt(" Escolha outro número: "));

        let contagem = prompt("Você deseja realizar: soma ou subtração")

        let result;

        if (conta == "soma") {
            let result = num1 + num2;
            window.alert("Resultado: " + result);

        }
        else if (contagem == "subtração") {
            let result = num1 - num2;
            window.alert("Reultado: " + result);
        }
        else {
            window.alert("Operação incorreta!");
        }

    </script>
