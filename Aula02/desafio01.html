<body>
    <h1><mark>MANIPULANDO OS ELEMENTO (TAGS)</mark> DO HTML ATRAVÉS DO JS</h1>
    <hr>
    <div>
        <p>ESTAMOS APRENDENDO JAVASCRIPT</p>
        <hr>
        <p>Palmeiras tetra</p>
        <p>Deus é bom e Brasil é HEXA!!</p>
    </div>
    <script>


        const tags_p = document.getElementsByTagName('p')
        

        console.log("MINHAS TAGS <p> ", tags_p);
        let tag_p_1 = tags_p[0]
        let tag_p_2 = tags_p[1];
        let tag_p_3 = tags_p[2];

        tag_p_1.style.backgroundColor="green";
        tag_p_1.style.color="blue";

        tag_p_2.style.backgroundColor="red";
        tag_p_2.style.color="black";

        tag_p_3.style.backgroundColor="pink";
        tag_p_3.style.textAlign="center";
        tag_p_3.innerText = "DEUS é bom!"

        let tags_body = document.getElementsByName("body")[0];

        tags_body.style.backgroundColor="pink";

        let tags_div = document.getElementsByName("div")[0];

        tags_div.style.backgroundColor = "blue";
        tags_div.style.border = "5px solid black";
        tags_div.style.padding = "10px";

        
    </script>

</body>
