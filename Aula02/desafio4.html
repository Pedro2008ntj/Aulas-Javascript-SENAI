<body>
    <h1><mark>DESAFIO 4</mark> DO HTML ATRAVÉS DO JS</h1>
    <hr>
    <div>
        <img id="Imagem principal" src="img/95quente.jpg" alt="Imagem do Desafio" title="95quente" width="300">
        <button onclick="trocarimagem()">Trocar Imagem</button>

    </div>
    <hr>

    <script>
        function trocarimagem() {

            const imagem = document.getElementsByTagName('img')[0];

            if (imagem.title=="95quente") {
                imagem.src="img/95chave.jpg";
                imagem.title="95chave"
            } else {
                imagem.src="img/95quente.jpg";
                imagem.title="95quente"
            }
        }



    </script>
</body>
